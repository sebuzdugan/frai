name: Responsible AI Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  rai-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Scan repository for AI indicators
        run: node packages/frai-cli/dist/index.js scan --ci

      - name: Unit tests (frai-core + frai-gate)
        run: |
          pnpm --filter frai-core exec vitest run || echo "::warning::frai-core tests failing (known, tracked)"
          pnpm --filter frai-gate exec vitest run

      - name: Responsible AI Gate on example spec
        run: |
          node packages/frai-gate/dist/cli.js check examples/rai-spec-example.md
