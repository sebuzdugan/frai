name: Responsible AI Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  rai-check:
    runs-on: ubuntu-latest
    # frai says it runs on Node 18 and up (CLI-18b: it once crashed on 18), so test each.
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Scan repository for AI indicators
        run: node packages/frai-cli/dist/index.js scan --ci

      - name: Tests (frai-core, frai-gate, frai CLI end to end)
        run: |
          pnpm --filter frai-core exec vitest run
          pnpm --filter frai-gate exec vitest run
          pnpm --filter frai exec vitest run

      - name: Responsible AI Gate on example spec
        run: |
          node packages/frai-gate/dist/cli.js check examples/frai-spec-example.md
